name: Lembretes de abastecimento

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 08:00 em Brasília
  workflow_dispatch:        # permite rodar manualmente na aba Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a Edge Function
        env:
          FUNCTION_URL: ${{ secrets.FUNCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$FUNCTION_URL" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
